version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: studentapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: studentdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./source-code/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studentapp-network

  studentapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studentapp-web
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - studentapp-network

volumes:
  mysql-data:

networks:
  studentapp-network:
    driver: bridge
